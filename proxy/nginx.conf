# Config COMPLETA de Nginx (reemplaza /etc/nginx/nginx.conf entero) del
# REVERSE PROXY: unico punto de entrada de todo el sistema desde el host.
# - Oculta la topologia interna (el cliente nunca habla directo con el
#   backend ni con la base de datos: esos servicios ni siquiera publican
#   puertos al host, ver docker-compose.yml).
# - Centraliza headers de seguridad.
# - Enruta por path: "/" -> frontend (estatico), "/api/" -> backend (API).
#
# Corre como usuario no-root desde el arranque (no solo los workers): ver
# comentarios sobre "pid" y los *_temp_path mas abajo.

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    server_tokens off;

    upstream frontend_upstream {
        server frontend:8080;
    }

    upstream backend_upstream {
        server backend:4000;
    }

    server {
        listen 8080;
        server_name _;

        # --- Headers de seguridad aplicados a todo lo que pasa por el proxy ---
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "0" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        client_max_body_size 200k;
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;

        # --- API: se reenvia al backend, preservando el prefijo /api ---
        location /api/ {
            proxy_pass http://backend_upstream/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Si el backend no responde (por ejemplo, si tambien estuviera
            # caido, no solo la DB), Nginx devuelve un 502/504 propio en
            # vez de colgar la conexion indefinidamente.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 1;
        }

        # --- Frontend: archivos estaticos servidos por el contenedor "frontend" ---
        location / {
            proxy_pass http://frontend_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /proxy-health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
