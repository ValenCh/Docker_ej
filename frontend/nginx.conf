# Config COMPLETA de Nginx (reemplaza /etc/nginx/nginx.conf entero) para el
# contenedor de FRONTEND, pensada para correr como usuario no-root desde el
# arranque (no solo los workers, como hace la imagen oficial por defecto).
#
# El reverse proxy (servicio "proxy") es el unico que expone puerto al
# host; este servicio solo es alcanzable dentro de la red interna de
# docker compose.

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Nginx corre sin privilegios de root: todos los directorios que
    # necesita escribir en runtime (buffers, cache, uploads temporales) se
    # redirigen a /tmp, que docker-compose.yml monta como tmpfs escribible
    # aunque el resto del filesystem del contenedor sea read_only.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    server {
        listen 8080;
        server_name _;

        # No revelar la version de Nginx en headers/paginas de error.
        server_tokens off;

        root /usr/share/nginx/html;
        index index.html;

        # SPA: cualquier ruta que no sea un archivo existente cae a
        # index.html para que el enrutado del lado del cliente (si lo
        # hubiera) funcione.
        location / {
            try_files $uri $uri/ /index.html;
        }

        location = /health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # Cache agresivo para assets versionados por Vite (con hash en el
        # nombre del archivo).
        location /assets/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
}
